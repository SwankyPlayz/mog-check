<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOG Check — AI Face Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0b0d15, #07080c);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; color: #fff;
    }
    .panel {
      background: rgba(18, 22, 33, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.02);
      width: 100%; max-width: 820px; padding: 32px;
    }
    h1 {
      font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
    }
    h1 i {
      background: linear-gradient(135deg,#a78bfa,#3b82f6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      font-size: 2.2rem;
    }
    .sub { color: #9ca3af; font-size: 0.9rem; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
    .sub i { color: #3b82f6; }

    .video-wrap {
      position: relative; border-radius: 28px; overflow: hidden;
      background: #0a0c12; aspect-ratio: 4/3;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; transition: filter 0.3s; }
    .video-wrap.inactive video { filter: blur(10px) brightness(0.5); }
    .ph {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: rgba(8,10,18,0.7); backdrop-filter: blur(12px);
      color: #cbd5e1; font-weight: 500; pointer-events: none; transition: opacity 0.3s;
    }
    .video-wrap:not(.inactive) .ph { opacity: 0; }
    .ph i { font-size: 3rem; color: #3b82f6; opacity: 0.8; }
    .ph span.small { font-size: 0.8rem; opacity: 0.6; }

    .progress { margin: 20px 0 12px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: #9ca3af; margin-bottom: 8px; }
    .progress-info b { color: #f1f5f9; }
    .progress-info .req { color: #fbbf24; font-size: 0.75rem; }
    .bar { height: 6px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg,#3b82f6,#a78bfa); border-radius: 10px; transition: width 0.3s ease; }

    .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 18px 0; }
    .btn {
      background: rgba(30,36,50,0.7); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 60px; padding: 13px 26px; font-weight: 600; font-size: 0.9rem;
      color: #f1f5f9; display: inline-flex; align-items: center; gap: 9px;
      cursor: pointer; transition: all 0.2s; letter-spacing: 0.01em;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    }
    .btn i { font-size: 1rem; }
    .btn-primary { background: linear-gradient(135deg,#2563eb,#4f46e5); border-color: rgba(255,255,255,0.15); }
    .btn-primary:hover { transform: scale(1.03); background: linear-gradient(135deg,#3b82f6,#6366f1); }
    .btn-secondary:hover { background: rgba(50,58,78,0.85); transform: scale(1.03); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; pointer-events: none; filter: grayscale(0.5); }

    .status {
      background: rgba(12,16,24,0.6); border-radius: 20px;
      padding: 14px 20px; border: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 14px; font-size: 0.88rem; color: #b0b8cc;
      min-height: 62px;
    }
    .status-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(59,130,246,0.15); display: flex; align-items: center; justify-content: center;
      color: #3b82f6; font-size: 1rem; flex-shrink: 0;
    }
    .status-text { flex: 1; line-height: 1.4; }
    .status-text b { color: #e2e8f0; }

    .result {
      margin-top: 16px; padding: 26px 20px; text-align: center;
      background: linear-gradient(145deg, rgba(30,36,50,0.9), rgba(18,22,33,0.95));
      border: 1px solid rgba(255,255,255,0.08); border-radius: 24px;
      animation: fadeSlide 0.5s ease;
    }
    .result.hidden { display: none; }
    .score {
      font-size: 3.5rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg,#a78bfa,#3b82f6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .verdict { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; margin: 6px 0 4px; }
    .advice { font-size: 0.88rem; color: #9ca3af; }

    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    footer {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 20px; font-size: 0.72rem; color: #6b7280;
      border-top: 1px solid rgba(255,255,255,0.04); padding-top: 18px;
    }
    footer i { color: #3b82f6; }

    @media (max-width: 560px) {
      .panel { padding: 20px; border-radius: 28px; }
      h1 { font-size: 1.6rem; }
      .btn { padding: 11px 18px; font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1><i class="fas fa-camera-retro"></i> MOG CHECK</h1>
    <div class="sub"><i class="fas fa-shield-alt"></i> AI analysis · Secure session · No login</div>

    <div class="video-wrap inactive" id="videoWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="ph">
        <i class="fas fa-camera"></i>
        <span>Camera off</span>
        <span class="small">Press "Start Camera"</span>
      </div>
    </div>

    <div class="progress">
      <div class="progress-info">
        <span><b id="count">0</b> / 10 photos</span>
        <span class="req">min 3 · max 10</span>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="startBtn"><i class="fas fa-video"></i> Start Camera</button>
      <button class="btn btn-primary" id="captureBtn" disabled><i class="fas fa-camera"></i> Capture</button>
      <button class="btn btn-primary" id="analyzeBtn" disabled><i class="fas fa-brain"></i> Analyze MOG</button>
    </div>

    <div class="status" id="status">
      <div class="status-icon"><i class="fas fa-circle-info" id="sIcon"></i></div>
      <div class="status-text" id="sText"><b>Ready.</b> Start camera, capture 3–10 photos, then analyze.</div>
    </div>

    <div class="result hidden" id="result">
      <div class="score" id="rScore">--</div>
      <div class="verdict" id="rVerdict">--</div>
      <div class="advice" id="rAdvice">--</div>
    </div>

    <footer><i class="fas fa-lock"></i> Photos processed securely server-side. Session ends when you close the tab.</footer>
  </div>

  <script>
    const video = document.getElementById('video');
    const videoWrap = document.getElementById('videoWrap');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const countEl = document.getElementById('count');
    const fillEl = document.getElementById('fill');
    const sText = document.getElementById('sText');
    const sIcon = document.getElementById('sIcon');
    const result = document.getElementById('result');
    const rScore = document.getElementById('rScore');
    const rVerdict = document.getElementById('rVerdict');
    const rAdvice = document.getElementById('rAdvice');

    let stream = null, active = false;
    let photos = [];
    const MIN = 3, MAX = 10;

    function setStatus(msg, icon = 'fa-circle-info', err = false) {
      sText.innerHTML = msg;
      sIcon.className = 'fas ' + icon;
      sIcon.style.color = err ? '#ef4444' : '#3b82f6';
    }

    function refreshUI() {
      const n = photos.length;
      countEl.textContent = n;
      fillEl.style.width = (n / MAX * 100) + '%';
      captureBtn.disabled = !active || n >= MAX;
      analyzeBtn.disabled = n < MIN || n > MAX;
      if (n === 0) setStatus('<b>Ready.</b> Start camera, capture 3–10 photos, then analyze.');
      else if (n < MIN) setStatus(`<b>${n} photo(s) captured.</b> Need ${MIN - n} more.`, 'fa-camera');
      else if (n >= MIN && !result.classList.contains('hidden') === false) {
        setStatus(`<b>${n} photo(s) captured.</b> Ready to analyze.`, 'fa-check-circle');
      } else {
        setStatus(`<b>${n} photo(s) captured.</b> You can analyze now.`, 'fa-check-circle');
      }
    }

    async function startCamera() {
      if (active) return;
      setStatus('Requesting camera access...', 'fa-spinner fa-pulse');
      startBtn.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        videoWrap.classList.remove('inactive');
        active = true;
        captureBtn.disabled = false;
        startBtn.disabled = false;
        setStatus('<b>Camera active.</b> Capture your photos.', 'fa-camera');
      } catch (e) {
        setStatus('<b>Camera error:</b> ' + (e.name === 'NotAllowedError' ? 'Permission denied.' : e.message), 'fa-exclamation-triangle', true);
        startBtn.disabled = false;
      }
    }

    function capture() {
      if (!active || !video.videoWidth || photos.length >= MAX) return;
      const c = document.createElement('canvas');
      c.width = video.videoWidth; c.height = video.videoHeight;
      const ctx = c.getContext('2d');
      ctx.translate(c.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);
      photos.push(c.toDataURL('image/jpeg', 0.85));
      try { sessionStorage.setItem('mogPhotos', JSON.stringify(photos)); } catch {}
      refreshUI();
    }

    async function analyze() {
      if (photos.length < MIN) return;
      analyzeBtn.disabled = true; captureBtn.disabled = true; startBtn.disabled = true;
      setStatus('<b>Analyzing your MOG...</b>', 'fa-spinner fa-pulse');
      try {
        const res = await fetch('/.netlify/functions/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ images: photos })
        });
        if (!res.ok) throw new Error('Analysis failed');
        const data = await res.json();
        rScore.textContent = data.mogScore;
        rVerdict.textContent = data.verdict;
        rAdvice.textContent = data.advice;
        result.classList.remove('hidden');
        setStatus(`<b>Analysis complete.</b> MOG score: ${data.mogScore}/100`, 'fa-brain');
        sIcon.style.color = data.mogScore > 60 ? '#fbbf24' : '#3b82f6';
      } catch (e) {
        setStatus('<b>Error:</b> ' + e.message, 'fa-exclamation-triangle', true);
      } finally {
        analyzeBtn.disabled = photos.length < MIN;
        captureBtn.disabled = !active || photos.length >= MAX;
        startBtn.disabled = false;
      }
    }

    startBtn.onclick = startCamera;
    captureBtn.onclick = capture;
    analyzeBtn.onclick = analyze;

    // Restore session
    window.addEventListener('load', () => {
      try {
        const s = sessionStorage.getItem('mogPhotos');
        if (s) { photos = JSON.parse(s); refreshUI(); }
      } catch {}
    });
    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
    });

    refreshUI();
  </script>
</body>
</html>
